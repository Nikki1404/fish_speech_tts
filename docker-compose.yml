name: fish-speech-s2-pro-ws
services:
  model-downloader:
    profiles:
    - download
    build:
      context: .
      dockerfile: Dockerfile.downloader
    command:
    - fishaudio/s2-pro
    - --local-dir
    - /checkpoints/s2-pro
    volumes:
    - ./checkpoints:/checkpoints
  fish-speech:
    restart: unless-stopped
    environment:
      API_SERVER_NAME: 0.0.0.0
      API_SERVER_PORT: '8080'
      LLAMA_CHECKPOINT_PATH: ${LLAMA_CHECKPOINT_PATH:-checkpoints/s2-pro}
      DECODER_CHECKPOINT_PATH: ${DECODER_CHECKPOINT_PATH:-checkpoints/s2-pro/codec.pth}
      DECODER_CONFIG_NAME: ${DECODER_CONFIG_NAME:-modded_dac_vq}
      COMPILE: ${COMPILE:-1}
      BACKEND: cuda
    volumes:
    - ./checkpoints:/app/checkpoints:ro
    - ./references:/app/references
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8080/v1/health
      interval: 20s
      timeout: 10s
      start_period: 180s
      retries: 15
    build:
      context: .
      dockerfile: Dockerfile.fish
      args:
        FISH_SPEECH_IMAGE: ${FISH_SPEECH_IMAGE:-fishaudio/fish-speech:server-cuda}
    image: local/fish-speech-s2-pro-ws:cuda
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FISH_HTTP_URL: http://fish-speech:8080
      WS_API_KEY: ${WS_API_KEY:-}
      MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-8000}
      UPSTREAM_CONNECT_TIMEOUT: ${UPSTREAM_CONNECT_TIMEOUT:-30}
      UPSTREAM_READ_TIMEOUT: ${UPSTREAM_READ_TIMEOUT:-900}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      fish-speech:
        condition: service_healthy
    ports:
    - ${GATEWAY_PORT:-8880}:8880
